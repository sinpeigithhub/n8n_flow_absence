<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欠席・臨時利用 申請フォーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F4EF;
    --card: #FFFFFF;
    --ink: #2A2723;
    --ink-soft: #63594B;
    --teal: #2F5D53;
    --teal-deep: #1F433B;
    --sage: #CFE0D3;
    --amber: #C98A3B;
    --border: #E2DCCC;
    --danger: #B4483A;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header.top {
    margin-bottom: 28px;
  }

  .facility-name {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--teal);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 10px;
    letter-spacing: 0.02em;
  }

  .lead {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0;
    max-width: 46ch;
  }

  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 22px;
    margin-top: 24px;
  }

  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 30px;
  }

  fieldset:last-of-type { margin-bottom: 0; }

  legend, .field-label {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--teal-deep);
    padding: 0;
    margin-bottom: 12px;
    display: block;
  }

  .req {
    color: var(--danger);
    font-weight: 500;
    font-size: 12px;
    margin-left: 6px;
  }

  .field {
    margin-bottom: 18px;
  }
  .field:last-child { margin-bottom: 0; }

  .field-label {
    font-size: 14px;
    margin-bottom: 8px;
  }

  .hint {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: -4px 0 8px;
  }

  input[type="text"],
  input[type="tel"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: #FDFCFA;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    transition: border-color 0.15s ease;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  .type-option input:focus-visible + span {
    outline: 3px solid var(--amber);
    outline-offset: 1px;
    border-color: var(--amber);
  }

  /* 申請種別: 大きなトグル */
  .type-group {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
  }

  .type-option {
    position: relative;
  }

  .type-option input {
    position: absolute;
    opacity: 0;
    inset: 0;
    cursor: pointer;
  }

  .type-option span {
    display: block;
    text-align: center;
    padding: 16px 8px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-weight: 500;
    font-size: 15px;
    color: var(--ink-soft);
    background: #FDFCFA;
    transition: all 0.15s ease;
  }

  .type-option input:checked + span {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
    font-weight: 700;
  }

  .radio-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
  }

  .radio-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14.5px;
    cursor: pointer;
  }

  .radio-row input { accent-color: var(--teal); width: 17px; height: 17px; }

  /* 対象日: 複数追加リスト */
  .date-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 12px;
  }

  .date-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .date-row input[type="date"] {
    flex: 1;
  }

  .remove-date {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border: 1.5px solid var(--border);
    background: #FDFCFA;
    color: var(--ink-soft);
    border-radius: 8px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .remove-date:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .remove-date:not(:disabled):hover {
    border-color: var(--danger);
    color: var(--danger);
  }

  .add-date {
    background: none;
    border: 1.5px dashed var(--teal);
    color: var(--teal);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
  }

  .add-date:hover {
    background: var(--sage);
  }

  /* 振替利用: 休み日/振替日のペアリスト */
  .transfer-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 12px;
  }

  .transfer-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }

  .transfer-pair {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .transfer-field .field-label {
    font-size: 12.5px;
    margin-bottom: 6px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .remove-transfer {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border: 1.5px solid var(--border);
    background: #FDFCFA;
    color: var(--ink-soft);
    border-radius: 8px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .remove-transfer:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .remove-transfer:not(:disabled):hover {
    border-color: var(--danger);
    color: var(--danger);
  }

  .submit-row {
    margin-top: 30px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }

  button.submit {
    width: 100%;
    padding: 15px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--teal);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.submit:hover { background: var(--teal-deep); }
  button.submit:disabled { background: #B7C4BE; cursor: not-allowed; }

  .status {
    margin-top: 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
    text-align: center;
    min-height: 18px;
  }

  /* 送信完了画面 */
  .confirm {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 26px;
    margin-top: 24px;
    text-align: center;
  }

  .confirm .icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--sage);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .confirm h2 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 19px;
    color: var(--teal-deep);
    margin: 0 0 10px;
  }

  .confirm p {
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 0 0 4px;
  }

  .confirm .summary {
    text-align: left;
    background: var(--bg);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 20px 0;
    font-size: 14px;
  }
  .confirm .summary div { margin-bottom: 6px; }
  .confirm .summary div:last-child { margin-bottom: 0; }
  .confirm .summary b { color: var(--teal-deep); }

  .note-box {
    margin-top: 22px;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: #EFEBE0;
    border-radius: 10px;
    padding: 12px 14px;
  }

  @media (max-width: 380px) {
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="top">
    <p class="facility-name">○○ワークセンター</p>
    <h1>欠席・臨時利用の申請</h1>
    <p class="lead">体調不良や急なご都合でお休みされる場合、または予定にない日にご利用される場合は、このフォームからご連絡ください。</p>
  </header>

  <form id="applyForm" novalidate>

    <fieldset>
      <legend>申請の種類<span class="req">必須</span></legend>
      <div class="type-group">
        <label class="type-option">
          <input type="radio" name="type" value="欠席" required>
          <span>欠席のご連絡</span>
        </label>
        <label class="type-option">
          <input type="radio" name="type" value="臨時利用">
          <span>臨時利用のお申込み</span>
        </label>
        <label class="type-option">
          <input type="radio" name="type" value="振替利用">
          <span>振替利用のお申込み</span>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>お名前<span class="req">必須</span></legend>
      <div class="field">
        <p class="hint" id="userNameHint">LINEにログインした状態のお名前が自動で入力されます。</p>
        <input type="text" id="userName" name="userName" placeholder="例）山田 太郎" required autocomplete="name">
      </div>
    </fieldset>

    <fieldset id="normalDateSection">
      <legend>対象の日付<span class="req">必須</span></legend>
      <p class="hint">翌日以降の日付を選択してください。複数の日にまたがる場合は、日付を追加してください。</p>
      <div id="dateList" class="date-list">
        <div class="date-row">
          <input type="date" class="target-date" required>
          <button type="button" class="remove-date" aria-label="この日付を削除" disabled>×</button>
        </div>
      </div>
      <button type="button" id="addDateBtn" class="add-date">＋ 日付を追加</button>
    </fieldset>

    <fieldset id="transferDateSection" style="display:none;">
      <legend>振替の日付<span class="req">必須</span></legend>
      <p class="hint">翌日以降の日付を選択してください。休む日と、その振替として利用する日をそれぞれ選んでください。</p>
      <div id="transferList" class="transfer-list">
        <div class="transfer-row">
          <div class="transfer-pair">
            <div class="transfer-field">
              <label class="field-label">休みの日付</label>
              <input type="date" class="off-date" required>
            </div>
            <div class="transfer-field">
              <label class="field-label">振替の日付</label>
              <input type="date" class="transfer-date" required>
            </div>
          </div>
          <button type="button" class="remove-transfer" aria-label="この振替を削除" disabled>×</button>
        </div>
      </div>
      <button type="button" id="addTransferBtn" class="add-date">＋ 振替を追加</button>
    </fieldset>

    <fieldset>
      <legend>理由</legend>
      <div class="field">
        <select id="reason" name="reason">
          <option value="体調不良">体調不良</option>
          <option value="通院">通院</option>
          <option value="家庭の事情">家庭の事情</option>
          <option value="交通機関の乱れ">交通機関の乱れ</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label" for="reasonDetail">補足があればご記入ください</label>
        <textarea id="reasonDetail" name="reasonDetail" placeholder="任意でご記入ください"></textarea>
      </div>
    </fieldset>


    <div class="submit-row">
      <button type="submit" class="submit" id="submitBtn">この内容で送信する</button>
      <p class="status" id="statusMsg" role="status"></p>
    </div>
  </form>

  <section class="confirm" id="confirmScreen" aria-live="polite">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M4 12.5L9.5 18L20 6" stroke="#2F5D53" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>送信しました</h2>
    <p>申請内容を受け付けました。スタッフが確認いたします。</p>
    <div class="summary" id="summaryBox"></div>
  </section>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const form = document.getElementById('applyForm');
  const confirmScreen = document.getElementById('confirmScreen');
  const summaryBox = document.getElementById('summaryBox');
  const statusMsg = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');
  const dateList = document.getElementById('dateList');
  const addDateBtn = document.getElementById('addDateBtn');
  const normalDateSection = document.getElementById('normalDateSection');
  const transferDateSection = document.getElementById('transferDateSection');
  const transferList = document.getElementById('transferList');
  const addTransferBtn = document.getElementById('addTransferBtn');
  const userNameInput = document.getElementById('userName');
  const userNameHint = document.getElementById('userNameHint');

  // ── LINEログイン連携(LIFF) ──────────────────────
  // ここに、LINE Developersコンソールで発行されたLIFF IDを設定する
  const LIFF_ID = '2011579620-SwtAzmHJ';

  // LINEのユーザーID(なりすまし防止の裏付け用。表示名と違い本人しか持てない値)
  let lineUserId = '';
  let lineDisplayName = '';

  async function initLiff() {
    try {
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return; // ログイン画面に遷移するため、ここで処理を止める
      }

      const profile = await liff.getProfile();
      lineUserId = profile.userId;
      lineDisplayName = profile.displayName;

      // まず、LINEの表示名を仮に入れておく(名簿照会に失敗した場合の保険)
      userNameInput.value = lineDisplayName;
      userNameInput.readOnly = true;
      userNameInput.style.background = '#EFEBE0';
      if (userNameHint) {
        userNameHint.textContent = '確認中…';
      }

      // 利用者名簿から本名を照会し、見つかればそちらを優先して表示する
      const LOOKUP_URL = 'https://n8n-izanaiset.xvps.jp/webhook/lookup-name';
      try {
        const res = await fetch(LOOKUP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ lineUserId })
        });
        const result = await res.json();

        if (result && result.found && result.realName) {
          userNameInput.value = result.realName;
          if (userNameHint) {
            userNameHint.textContent = '利用者名簿の登録名から自動入力されています(変更はできません)。';
          }
        } else {
          if (userNameHint) {
            userNameHint.textContent = '利用者名簿に未登録のため、LINEの表示名を仮に入力しています。スタッフにお伝えください。';
          }
        }
      } catch (lookupErr) {
        // 照会に失敗しても、LINEの表示名のまま送信自体は継続できるようにする
        if (userNameHint) {
          userNameHint.textContent = '名簿の確認ができませんでした。LINEの表示名を仮に入力しています。';
        }
        console.error('name lookup error:', lookupErr);
      }
    } catch (err) {
      // LIFF以外(通常のブラウザ)で開いた場合など、LINE連携が使えない場合はここに来る
      // スマホの開発者ツールが使えなくても分かるよう、エラー内容を画面にそのまま表示する
      const detail = (err && (err.message || err.code)) ? `${err.code || ''} ${err.message || ''}`.trim() : String(err);
      if (userNameHint) {
        userNameHint.textContent = `LINEでの本人確認ができませんでした。[エラー詳細: ${detail}]`;
      }
      console.error('LIFF init error:', err);
    }
  }

  initLiff();

  // 対象日は翌日以降のみ選べるようにする(カレンダーUI・手入力の両方に効く)
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const minDateStr = tomorrow.toLocaleDateString('sv-SE'); // "YYYY-MM-DD"形式

  function applyMinToAllDates() {
    dateList.querySelectorAll('.target-date').forEach(input => { input.min = minDateStr; });
    transferList.querySelectorAll('input[type="date"]').forEach(input => { input.min = minDateStr; });
  }

  function updateRemoveButtons() {
    const rows = dateList.querySelectorAll('.date-row');
    rows.forEach(row => {
      row.querySelector('.remove-date').disabled = rows.length <= 1;
    });
  }

  function addDateRow() {
    const row = document.createElement('div');
    row.className = 'date-row';
    row.innerHTML = `
      <input type="date" class="target-date" required>
      <button type="button" class="remove-date" aria-label="この日付を削除">×</button>
    `;
    dateList.appendChild(row);
    applyMinToAllDates();
    updateRemoveButtons();
  }

  addDateBtn.addEventListener('click', addDateRow);

  dateList.addEventListener('click', (e) => {
    if (e.target.classList.contains('remove-date') && !e.target.disabled) {
      e.target.closest('.date-row').remove();
      updateRemoveButtons();
    }
  });

  // ── 振替利用: 休みの日付 / 振替の日付 ペアの追加・削除 ──────
  function updateTransferRemoveButtons() {
    const rows = transferList.querySelectorAll('.transfer-row');
    rows.forEach(row => {
      row.querySelector('.remove-transfer').disabled = rows.length <= 1;
    });
  }

  function addTransferRow() {
    const row = document.createElement('div');
    row.className = 'transfer-row';
    row.innerHTML = `
      <div class="transfer-pair">
        <div class="transfer-field">
          <label class="field-label">休みの日付</label>
          <input type="date" class="off-date" required>
        </div>
        <div class="transfer-field">
          <label class="field-label">振替の日付</label>
          <input type="date" class="transfer-date" required>
        </div>
      </div>
      <button type="button" class="remove-transfer" aria-label="この振替を削除">×</button>
    `;
    transferList.appendChild(row);
    applyMinToAllDates();
    updateTransferRemoveButtons();
  }

  addTransferBtn.addEventListener('click', addTransferRow);

  transferList.addEventListener('click', (e) => {
    if (e.target.classList.contains('remove-transfer') && !e.target.disabled) {
      e.target.closest('.transfer-row').remove();
      updateTransferRemoveButtons();
    }
  });

  // ── 申請の種類によって、表示する日付欄を切り替える ──────
  function updateSectionVisibility() {
    const isTransfer = form.type.value === '振替利用';
    normalDateSection.style.display = isTransfer ? 'none' : '';
    transferDateSection.style.display = isTransfer ? '' : 'none';

    // 表示していないセクションのrequiredは外し、フォーム全体のバリデーションに影響させない
    dateList.querySelectorAll('.target-date').forEach(input => { input.required = !isTransfer; });
    transferList.querySelectorAll('input[type="date"]').forEach(input => { input.required = isTransfer; });
  }

  form.querySelectorAll('input[name="type"]').forEach(radio => {
    radio.addEventListener('change', updateSectionVisibility);
  });

  applyMinToAllDates();
  updateRemoveButtons();
  updateTransferRemoveButtons();
  updateSectionVisibility();

  // このフォームはGitHub Pagesなど、n8nとは別の場所から配信される想定のため、
  // 送信先はn8nのWebhook(送信受付)のURLを直接指定する
  const ENDPOINT_URL = 'https://n8n-izanaiset.xvps.jp/webhook/apply-form';

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!lineUserId) {
      statusMsg.textContent = 'LINEでの本人確認ができていません。LINEアプリ内のリンクから開き直してください。';
      return;
    }

    const type = form.type.value;
    if (!type) { statusMsg.textContent = '申請の種類を選択してください。'; return; }
    if (!form.userName.value.trim()) { statusMsg.textContent = 'お名前を入力してください。'; return; }

    const isTransfer = type === '振替利用';
    let payload;

    if (isTransfer) {
      const pairRows = Array.from(transferList.querySelectorAll('.transfer-row'));
      const transferPairs = pairRows.map(row => ({
        offDate: row.querySelector('.off-date').value,
        transferDate: row.querySelector('.transfer-date').value
      })).filter(pair => pair.offDate && pair.transferDate);

      if (transferPairs.length === 0) { statusMsg.textContent = '休みの日付と振替の日付を入力してください。'; return; }
      const hasPastDate = transferPairs.some(p => p.offDate < minDateStr || p.transferDate < minDateStr);
      if (hasPastDate) { statusMsg.textContent = '日付は翌日以降を選択してください。'; return; }

      payload = {
        type,
        userName: form.userName.value.trim(),
        transferPairs,
        reason: form.reason.value,
        reasonDetail: form.reasonDetail.value.trim(),
        submittedAt: new Date().toISOString(),
        lineUserId,
        lineDisplayName
      };
    } else {
      const dateInputs = Array.from(dateList.querySelectorAll('.target-date'));
      const targetDates = dateInputs.map(input => input.value).filter(Boolean);

      if (targetDates.length === 0) { statusMsg.textContent = '対象の日付を入力してください。'; return; }
      if (targetDates.some(d => d < minDateStr)) { statusMsg.textContent = '対象の日付は翌日以降を選択してください。'; return; }

      // 重複日を除いて、日付順に並べる
      const uniqueSortedDates = Array.from(new Set(targetDates)).sort();

      payload = {
        type,
        userName: form.userName.value.trim(),
        targetDates: uniqueSortedDates,
        reason: form.reason.value,
        reasonDetail: form.reasonDetail.value.trim(),
        submittedAt: new Date().toISOString(),
        lineUserId,
        lineDisplayName
      };
    }

    submitBtn.disabled = true;
    statusMsg.textContent = '送信しています…';

    try {
      if (ENDPOINT_URL) {
        // n8nのWebhook(送信受付)へPOST
        await fetch(ENDPOINT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
      } else {
        // サンプル動作用の疑似送信
        await new Promise(res => setTimeout(res, 500));
      }

      showConfirm(payload);
      form.reset();

      // 日付リストを1行だけの状態に戻す
      dateList.innerHTML = `
        <div class="date-row">
          <input type="date" class="target-date" required>
          <button type="button" class="remove-date" aria-label="この日付を削除" disabled>×</button>
        </div>
      `;

      // 振替リストも1行だけの状態に戻す
      transferList.innerHTML = `
        <div class="transfer-row">
          <div class="transfer-pair">
            <div class="transfer-field">
              <label class="field-label">休みの日付</label>
              <input type="date" class="off-date" required>
            </div>
            <div class="transfer-field">
              <label class="field-label">振替の日付</label>
              <input type="date" class="transfer-date" required>
            </div>
          </div>
          <button type="button" class="remove-transfer" aria-label="この振替を削除" disabled>×</button>
        </div>
      `;

      applyMinToAllDates();
      updateSectionVisibility();
    } catch (err) {
      statusMsg.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
    } finally {
      submitBtn.disabled = false;
    }
  });

  function showConfirm(payload) {
    const dateLine = payload.transferPairs
      ? payload.transferPairs.map(p => `${p.offDate} → ${p.transferDate}`).join('、')
      : payload.targetDates.join('、');
    const dateLabel = payload.transferPairs ? '振替内容' : '対象日';

    summaryBox.innerHTML = `
      <div><b>種別：</b>${payload.type}</div>
      <div><b>お名前：</b>${escapeHtml(payload.userName)}</div>
      <div><b>${dateLabel}：</b>${escapeHtml(dateLine)}</div>
      <div><b>理由：</b>${payload.reason}${payload.reasonDetail ? '（' + escapeHtml(payload.reasonDetail) + '）' : ''}</div>
    `;
    form.style.display = 'none';
    confirmScreen.style.display = 'block';
    statusMsg.textContent = '';
  }


  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
